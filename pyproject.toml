[project]
name = "fingerprint-system"
version = "1.0.0"
description = "Fingerprint Recognition System for Raspberry Pi"
requires-python = ">=3.9"
dependencies = [
    "opencv-python",
    "numpy>=1.26,<2.0",
    "scikit-image>=0.22",
    "scikit-learn>=1.3.2",
    "pyfingerprint==1.5",
    "flask==2.3.2",
    "pillow==10.0.0",
    "torch>=2.0",
    "onnx>=1.14",
    "pyserial==3.5",
    "fake-rpi==0.7.1"
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=core --cov=database --cov=models --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*", "*/fake_rpi*"]
